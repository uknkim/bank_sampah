<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Jadwal Kegiatan</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="../assets/css/style.css">

<link
rel="stylesheet"
href="../assets/css/admin.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside id="sidebar"></aside>

    <!-- Main -->
    <main class="main-content">

        <!-- Navbar -->
        <header id="navbar"></header>

        <!-- Content -->
        <section class="content-area">

            <!-- Header -->
            <div class="page-header">

                <div>

                    <h3>Jadwal Kegiatan</h3>

                    <p>Kelola jadwal kegiatan Bank Sampah Metro 46.</p>

                </div>

                <button
                id="btnTambahJadwal"
                class="btn btn-add"
                data-bs-toggle="modal"
                data-bs-target="#modalTambahJadwal">

                    <i class="bi bi-plus-circle"></i>

                    Tambah Jadwal

                </button>

            </div>

            <!-- Table -->
            <div class="card table-card">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>

                                <tr>

                                    <th width="70">No</th>

                                    <th>Judul Kegiatan</th>

                                    <th width="150">Tanggal</th>

                                    <th width="120">Waktu</th>

                                    <th>Lokasi</th>

                                    <th width="170">Aksi</th>

                                </tr>

                            </thead>

                            <tbody id="tabelJadwal">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </section>

        <!-- ==========================
             Modal Tambah Jadwal
        ========================== -->

        <div
        class="modal fade"
        id="modalTambahJadwal"
        tabindex="-1"
        aria-labelledby="modalTambahJadwalLabel"
        aria-hidden="true">

            <div class="modal-dialog modal-lg">

                <div class="modal-content">

                    <!-- Header -->
                    <div class="modal-header">

                        <h5
                        class="modal-title"
                        id="modalTambahJadwalLabel">

                            <i class="bi bi-plus-circle me-2"></i>

                            Tambah Jadwal Kegiatan

                        </h5>

                        <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                        </button>

                    </div>

                    <!-- Body -->
                    <div class="modal-body">

                        <form
                        id="formTambahJadwal">

                            <div class="mb-3">

                                <label class="form-label">

                                    Judul Kegiatan

                                </label>

                                <input
                                type="text"
                                class="form-control"
                                id="judul_kegiatan"
                                placeholder="Masukkan judul kegiatan"
                                required>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Tanggal

                                    </label>

                                    <input
                                    type="date"
                                    class="form-control"
                                    id="tanggal"
                                    required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Waktu

                                    </label>

                                    <input
                                    type="time"
                                    class="form-control"
                                    id="waktu"
                                    required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Lokasi

                                </label>

                                <input
                                type="text"
                                class="form-control"
                                id="lokasi"
                                placeholder="Masukkan lokasi kegiatan"
                                required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Deskripsi

                                </label>

                                <textarea
                                class="form-control"
                                id="deskripsi"
                                rows="4"
                                placeholder="Masukkan deskripsi kegiatan"
                                required></textarea>

                            </div>

                        </form>

                    </div>

                                        <!-- Footer -->
                    <div class="modal-footer">

                        <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                            Batal

                        </button>

                        <button
                        type="submit"
                        form="formTambahJadwal"
                        class="btn btn-success">

                            <i class="bi bi-save me-1"></i>

                            Simpan

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- ==========================
             Modal Edit Jadwal
        ========================== -->

        <div
        class="modal fade"
        id="modalEditJadwal"
        tabindex="-1"
        aria-labelledby="modalEditJadwalLabel"
        aria-hidden="true">

            <div class="modal-dialog modal-lg">

                <div class="modal-content">

                    <!-- Header -->
                    <div class="modal-header">

                        <h5
                        class="modal-title"
                        id="modalEditJadwalLabel">

                            <i class="bi bi-pencil-square me-2"></i>

                            Edit Jadwal Kegiatan

                        </h5>

                        <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                        </button>

                    </div>

                    <!-- Body -->
                    <div class="modal-body">

                        <form
                        id="formEditJadwal">

                            <input
                            type="hidden"
                            id="id_jadwal">

                            <div class="mb-3">

                                <label class="form-label">

                                    Judul Kegiatan

                                </label>

                                <input
                                type="text"
                                class="form-control"
                                id="edit_judul_kegiatan"
                                required>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Tanggal

                                    </label>

                                    <input
                                    type="date"
                                    class="form-control"
                                    id="edit_tanggal"
                                    required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Waktu

                                    </label>

                                    <input
                                    type="time"
                                    class="form-control"
                                    id="edit_waktu"
                                    required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Lokasi

                                </label>

                                <input
                                type="text"
                                class="form-control"
                                id="edit_lokasi"
                                required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Deskripsi

                                </label>

                                <textarea
                                class="form-control"
                                id="edit_deskripsi"
                                rows="4"
                                required></textarea>

                            </div>

                        </form>

                    </div>

                    <!-- Footer -->
                    <div class="modal-footer">

                        <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                            Batal

                        </button>

                        <button
                        type="submit"
                        form="formEditJadwal"
                        class="btn btn-warning">

                            <i class="bi bi-check-circle me-1"></i>

                            Update

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Footer -->
        <footer id="footer"></footer>

    </main>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Layout -->
<script src="../assets/js/layout.js"></script>

<!-- Jadwal -->
<script src="../assets/js/jadwal.js"></script>

</body>

</html>
