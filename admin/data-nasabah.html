<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Data Nasabah</title>

    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

    <link
        rel="stylesheet"
        href="../assets/css/admin.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->

    <aside id="sidebar"></aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Navbar -->

        <header id="navbar"></header>

        <!-- Content -->

        <section class="content-area">

            <!-- Page Header -->

            <div class="page-header">

                <div>

                    <h3>Data Nasabah</h3>

                    <p>Daftar seluruh data nasabah Bank Sampah Metro 46.</p>

                </div>

                <button
                id="btnTambahNasabah"
                class="btn btn-add"
                data-bs-toggle="modal"
                data-bs-target="#modalTambahNasabah">

                    <i class="bi bi-plus-circle"></i>

                    Tambah Nasabah

                </button>

            </div>

            <!-- Table -->

            <div class="card table-card">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>

                                <tr>

                                    <th width="60">No</th>

                                    <th>Nama Nasabah</th>

                                    <th>Alamat</th>

                                    <th>No. HP</th>

                                    <th width="170">Tanggal Bergabung</th>

                                    <th width="220">Aksi</th>

                                </tr>

                            </thead>

                            <tbody id="tabelNasabah">


                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </section>

        <!-- ===========================
             Modal Tambah Nasabah
        ============================ -->

        <div
            class="modal fade"
            id="modalTambahNasabah"
            tabindex="-1"
            aria-labelledby="modalTambahNasabahLabel"
            aria-hidden="true">

            <div class="modal-dialog modal-lg">

                <div class="modal-content">

                    <!-- Modal Header -->

                    <div class="modal-header">

                        <h5
                            class="modal-title"
                            id="modalTambahNasabahLabel">

                            <i class="bi bi-person-plus-fill me-2"></i>

                            Tambah Data Nasabah

                        </h5>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">

                        </button>

                    </div>

                    <!-- Modal Body -->

                    <div class="modal-body">

                        <form
                            id="formTambahNasabah">

                            <div class="row">

                                <!-- Nama -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Nama Nasabah

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="nama_nasabah"
                                        name="nama_nasabah"
                                        placeholder="Masukkan nama nasabah"
                                        required>

                                </div>

                                <!-- No HP -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        No. HP

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="no_hp"
                                        name="no_hp"
                                        placeholder="08xxxxxxxxxx"
                                        required>

                                </div>

                            </div>

                            <!-- Alamat -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Alamat

                                </label>

                                <textarea
                                    class="form-control"
                                    id="alamat"
                                    name="alamat"
                                    rows="3"
                                    placeholder="Masukkan alamat lengkap"
                                    required></textarea>

                            </div>

                            <!-- Tanggal Bergabung -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Tanggal Bergabung

                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="tanggal_bergabung"
                                    name="tanggal_bergabung"
                                    required>

                            </div>

                        </form>

                    </div>

                    <!-- Modal Footer -->

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Batal

                        </button>

                        <button
                            type="submit"
                            form="formTambahNasabah"
                            class="btn btn-success">

                            <i class="bi bi-save me-1"></i>

                            Simpan

                        </button>

                    </div>

                </div>

            </div>

        </div>





        <!-- ===========================
             Modal Edit Nasabah
        ============================ -->

        <div
            class="modal fade"
            id="modalEditNasabah"
            tabindex="-1"
            aria-labelledby="modalEditNasabahLabel"
            aria-hidden="true">

            <div class="modal-dialog modal-lg">

                <div class="modal-content">

                    <!-- Header -->

                    <div class="modal-header">

                        <h5
                            class="modal-title"
                            id="modalEditNasabahLabel">

                            <i class="bi bi-pencil-square me-2"></i>

                            Edit Data Nasabah

                        </h5>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">

                        </button>

                    </div>

                    <!-- Body -->

                    <div class="modal-body">

                        <form
                            id="formEditNasabah">

                            <input
                                type="hidden"
                                id="id_nasabah"
                                name="id_nasabah">

                            <div class="row">

                                <!-- Nama -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        Nama Nasabah

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="edit_nama_nasabah"
                                        name="nama_nasabah"
                                        required>

                                </div>

                                <!-- No HP -->

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        No. HP

                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="edit_no_hp"
                                        name="no_hp"
                                        required>

                                </div>

                            </div>

                            <!-- Alamat -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Alamat

                                </label>

                                <textarea
                                    class="form-control"
                                    id="edit_alamat"
                                    name="alamat"
                                    rows="3"
                                    required></textarea>

                            </div>

                            <!-- Tanggal Bergabung -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Tanggal Bergabung

                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="edit_tanggal_bergabung"
                                    name="tanggal_bergabung"
                                    required>

                            </div>

                        </form>

                    </div>

                    <!-- Footer -->

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Batal

                        </button>

                        <button
                            type="submit"
                            form="formEditNasabah"
                            class="btn btn-warning">

                            <i class="bi bi-check-circle me-1"></i>

                            Update

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Footer -->

        <footer id="footer"></footer>

    </main>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Data Dummy -->
<script src="../assets/js/data.js"></script>

<!-- Layout JS -->

<script src="../assets/js/layout.js"></script>

<!-- Admin JS -->

<script src="../assets/js/data-nasabah.js"></script>

</body>

</html>
