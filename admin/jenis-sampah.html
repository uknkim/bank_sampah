<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Jenis Sampah</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="../assets/css/style.css">

<link
rel="stylesheet"
href="../assets/css/admin.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside id="sidebar"></aside>

    <!-- Main -->
    <main class="main-content">

        <!-- Navbar -->
        <header id="navbar"></header>

        <!-- Content -->
        <section class="content-area">

            <!-- Header -->
            <div class="page-header">

                <div>

                    <h3>Data Jenis Sampah</h3>

                    <p>Kelola daftar jenis sampah beserta harga per kilogram.</p>

                </div>

                <button
                id="btnTambahJenis"
                class="btn btn-add"
                data-bs-toggle="modal"
                data-bs-target="#modalTambahJenis">

                    <i class="bi bi-plus-circle"></i>

                    Tambah Jenis Sampah

                </button>

            </div>

            <!-- Table -->
            <div class="card table-card">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>

                                <tr>

                                    <th width="70">No</th>

                                    <th>Jenis Sampah</th>

                                    <th width="220">Harga / Kg</th>

                                    <th width="180">Aksi</th>

                                </tr>

                            </thead>

                            <tbody id="tabelJenisSampah">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </section>

        <!-- ==========================
             Modal Tambah
        ========================== -->

        <div
        class="modal fade"
        id="modalTambahJenis"
        tabindex="-1"
        aria-labelledby="modalTambahJenisLabel"
        aria-hidden="true">

            <div class="modal-dialog">

                <div class="modal-content">

                    <!-- Header -->
                    <div class="modal-header">

                        <h5
                        class="modal-title"
                        id="modalTambahJenisLabel">

                            <i class="bi bi-plus-circle me-2"></i>

                            Tambah Jenis Sampah

                        </h5>

                        <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                        </button>

                    </div>

                    <!-- Body -->
                    <div class="modal-body">

                        <form
                        id="formTambahJenis">

                            <div class="mb-3">

                                <label class="form-label">

                                    Nama Jenis Sampah

                                </label>

                                <input
                                type="text"
                                class="form-control"
                                id="nama_jenis"
                                name="nama_jenis"
                                placeholder="Masukkan nama jenis sampah"
                                required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Harga per Kg

                                </label>

                                <input
                                type="number"
                                class="form-control"
                                id="harga_per_kg"
                                name="harga_per_kg"
                                placeholder="Masukkan harga"
                                min="0"
                                required>

                            </div>

                        </form>

                    </div>

                    <!-- Footer -->
                    <div class="modal-footer">

                        <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                            Batal

                        </button>

                        <button
                        type="submit"
                        form="formTambahJenis"
                        class="btn btn-success">

                            <i class="bi bi-save me-1"></i>

                            Simpan

                        </button>

                    </div>

                </div>

            </div>

        </div>

                <!-- ==========================
             Modal Edit
        ========================== -->

        <div
        class="modal fade"
        id="modalEditJenis"
        tabindex="-1"
        aria-labelledby="modalEditJenisLabel"
        aria-hidden="true">

            <div class="modal-dialog">

                <div class="modal-content">

                    <!-- Header -->
                    <div class="modal-header">

                        <h5
                        class="modal-title"
                        id="modalEditJenisLabel">

                            <i class="bi bi-pencil-square me-2"></i>

                            Edit Jenis Sampah

                        </h5>

                        <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">

                        </button>

                    </div>

                    <!-- Body -->
                    <div class="modal-body">

                        <form
                        id="formEditJenis">

                            <input
                            type="hidden"
                            id="id_jenis"
                            name="id_jenis">

                            <div class="mb-3">

                                <label class="form-label">

                                    Nama Jenis Sampah

                                </label>

                                <input
                                type="text"
                                class="form-control"
                                id="edit_nama_jenis"
                                name="nama_jenis"
                                required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Harga per Kg

                                </label>

                                <input
                                type="number"
                                class="form-control"
                                id="edit_harga_per_kg"
                                name="harga_per_kg"
                                min="0"
                                required>

                            </div>

                        </form>

                    </div>

                    <!-- Footer -->
                    <div class="modal-footer">

                        <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                            Batal

                        </button>

                        <button
                        type="submit"
                        form="formEditJenis"
                        class="btn btn-warning">

                            <i class="bi bi-check-circle me-1"></i>

                            Update

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Footer -->
        <footer id="footer"></footer>

    </main>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Data Dummy -->
<script src="../assets/js/data.js"></script>

<!-- Layout -->
<script src="../assets/js/layout.js"></script>

<!-- Jenis Sampah -->
<script src="../assets/js/jenis-sampah.js"></script>

</body>

</html>
