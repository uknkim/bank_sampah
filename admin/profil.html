<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profil Bank Sampah</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="../assets/css/style.css">

<link
rel="stylesheet"
href="../assets/css/admin.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside id="sidebar"></aside>

    <!-- Main -->
    <main class="main-content">

        <!-- Navbar -->
        <header id="navbar"></header>

        <!-- Content -->
        <section class="content-area">

            <!-- Header -->
            <div class="page-header">

                <div>

                    <h3>Profil Bank Sampah</h3>

                    <p>

                        Kelola informasi profil Bank Sampah Metro 46 yang akan ditampilkan pada halaman website.

                    </p>

                </div>

            </div>

            <div class="row">

                <!-- Logo -->
                <div class="col-lg-4 mb-4">

                    <div class="card h-100">

                        <div class="card-header">

                            <h5 class="mb-0">

                                Logo Bank Sampah

                            </h5>

                        </div>

                        <div class="card-body text-center">

                            <img
                            id="previewLogo"
                            src="../assets/img/logo.png"
                            alt="Logo Bank Sampah"
                            class="img-fluid rounded border mb-3"
                            style="max-width:220px;">

                            <input
                            type="file"
                            class="form-control"
                            id="logo"
                            accept="image/*">

                            <small
                            class="text-muted d-block mt-2">

                                Format JPG, JPEG atau PNG.

                            </small>

                        </div>

                    </div>

                </div>

                <!-- Form -->
                <div class="col-lg-8">

                    <div class="card">

                        <div class="card-header">

                            <h5 class="mb-0">

                                Informasi Bank Sampah

                            </h5>

                        </div>

                        <div class="card-body">

                            <form id="formProfil">

                                <input
                                type="hidden"
                                id="id_profil">

                                <div class="mb-3">

                                    <label class="form-label">

                                        Nama Bank Sampah

                                    </label>

                                    <input
                                    type="text"
                                    class="form-control"
                                    id="nama_bank_sampah"
                                    placeholder="Masukkan nama bank sampah"
                                    required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">

                                        Alamat

                                    </label>

                                    <textarea
                                    class="form-control"
                                    id="alamat"
                                    rows="3"
                                    placeholder="Masukkan alamat lengkap"
                                    required></textarea>

                                </div>

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Nomor HP

                                        </label>

                                        <input
                                        type="text"
                                        class="form-control"
                                        id="no_hp"
                                        placeholder="08xxxxxxxxxx"
                                        required>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Email

                                        </label>

                                        <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        placeholder="email@example.com"
                                        required>

                                    </div>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">

                                        Deskripsi

                                    </label>

                                    <textarea
                                    class="form-control"
                                    id="deskripsi"
                                    rows="6"
                                    placeholder="Masukkan deskripsi Bank Sampah"
                                    required></textarea>

                                </div>

                                                                <div class="d-flex justify-content-end">

                                    <button
                                    type="submit"
                                    class="btn btn-success">

                                        <i class="bi bi-save me-2"></i>

                                        Simpan Perubahan

                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- Footer -->
        <footer id="footer"></footer>

    </main>

</div>

<!-- Bootstrap JS -->
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Data Dummy -->
<script src="../assets/js/data.js"></script>

<!-- Layout -->
<script src="../assets/js/layout.js"></script>

<!-- Profil -->
<script src="../assets/js/profil.js"></script>

</body>

</html>
